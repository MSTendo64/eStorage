{% extends 'base.html' %}

{% block title %}Вход | Eventshock Storage{% endblock %}

{% block content %}
<div class="row justify-content-center mx-0">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-primary">
            <div class="card-header bg-primary text-white">
                <h3 class="text-center mb-0">
                    <i class="fas fa-key me-2"></i>
                    Вход
                </h3>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="fas fa-cloud-upload-alt fa-3x text-primary"></i>
                    </div>
                    <h4>С возвращением!</h4>
                    <p class="text-muted">
                        Войдите в свой аккаунт для доступа к облачному хранилищу
                    </p>
                    <small class="text-muted">используется Eventshock UID</small>
                </div>
                <form method="post" class="esuid-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя или Email</label>
                        <div class="input-group flex-column flex-md-row">
                            <span class="input-group-text w-100 w-md-auto">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control w-100" id="username" name="username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <div class="input-group flex-column flex-md-row">
                            <span class="input-group-text w-100 w-md-auto">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control w-100" id="password" name="password" required>
                            <button class="btn btn-outline-secondary w-100 w-md-auto mt-2 mt-md-0" type="button" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Войти
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
/* Обновленные стили для страницы входа в светлой теме */
[data-bs-theme="light"] body {
    background-color: #e9ecef !important;
}

[data-bs-theme="light"] .card {
    background-color: #ffffff !important;
    border-color: #ced4da !important;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important;
}

[data-bs-theme="light"] .card-body {
    color: #1a1d21 !important;
}

[data-bs-theme="light"] .card-body h4 {
    color: #0d1117 !important;
    font-weight: 600;
}

[data-bs-theme="light"] .card-body p,
[data-bs-theme="light"] .card-body small,
[data-bs-theme="light"] .card-body label {
    color: #1a1d21 !important;
}

[data-bs-theme="light"] .card-body .text-muted {
    color: #495057 !important;
}

[data-bs-theme="light"] .card-body a {
    color: #0d6efd !important;
}

[data-bs-theme="light"] .card-body a:hover {
    color: #0a58ca !important;
}

.esuid-form .input-group-text {
    background-color: var(--bs-primary);
    color: white;
    border-color: var(--bs-primary);
    min-width: 45px;
    justify-content: center;
}

[data-bs-theme="light"] .esuid-form .form-control {
    background-color: #ffffff !important;
    color: #1a1d21 !important;
    border-color: #ced4da !important;
    width: 100%;
    max-width: 100%;
}

[data-bs-theme="light"] .esuid-form .form-control:focus {
    background-color: #ffffff !important;
    color: #1a1d21 !important;
    border-color: var(--bs-primary) !important;
    box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
}

[data-bs-theme="light"] .form-label {
    color: #1a1d21 !important;
    font-weight: 500;
}

[data-bs-theme="light"] .btn-outline-secondary {
    color: #495057 !important;
    border-color: #ced4da !important;
}

[data-bs-theme="light"] .btn-outline-secondary:hover {
    background-color: #e9ecef !important;
    color: #1a1d21 !important;
    border-color: #adb5bd !important;
}

/* Мобильная адаптивность для формы входа */
@media (max-width: 767.98px) {
    .esuid-form .input-group {
        flex-wrap: wrap;
    }

    .esuid-form .input-group-text {
        width: 100%;
        border-radius: 0.375rem 0.375rem 0 0 !important;
        border-bottom: none;
    }

    .esuid-form .input-group .form-control {
        border-radius: 0 !important;
        border-top: none;
        width: 100%;
    }

    .esuid-form .input-group .btn {
        border-radius: 0 0 0.375rem 0.375rem !important;
        border-top: none;
        width: 100%;
    }

    .card {
        margin: 0;
        border-radius: 0.5rem;
    }

    .card-header {
        padding: 1rem;
    }

    .card-body {
        padding: 1rem;
    }

    h3 {
        font-size: 1.25rem;
    }

    h4 {
        font-size: 1.1rem;
    }

    .fa-3x {
        font-size: 2rem !important;
    }
}

/* Обеспечиваем читаемость текста кнопки "Войти" */
[data-bs-theme="light"] .btn-primary,
.btn-primary {
    color: #ffffff !important;
}

[data-bs-theme="light"] .btn-primary:hover,
.btn-primary:hover {
    color: #ffffff !important;
}

[data-bs-theme="light"] .btn-primary i,
.btn-primary i {
    color: #ffffff !important;
}

.card.border-primary {
    border-width: 2px;
}

.card.border-primary .card-header {
    border-bottom-width: 2px;
}
</style>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = input.nextElementSibling.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
