{% extends 'base.html' %}

{% block title %}Вход | Eventshock Storage{% endblock %}

{% block content %}
<div class="row justify-content-center mx-0">
    <div class="col-12">
        <div class="card border-primary login-card-container">
            <div class="card-header bg-primary text-white">
                <h3 class="text-center mb-0">
                    <i class="fas fa-key me-2"></i>
                    Вход
                </h3>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="fas fa-cloud-upload-alt fa-3x text-primary"></i>
                    </div>
                    <h4>С возвращением!</h4>
                    <p class="text-muted">
                        Войдите в свой аккаунт для доступа к облачному хранилищу
                    </p>
                    <small class="text-muted">используется Eventshock UID</small>
                </div>
                <form method="post" class="esuid-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label d-flex align-items-center">
                            <i class="fas fa-user me-2"></i>
                            Имя пользователя или Email
                        </label>
                        <div class="d-flex align-items-center">
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label d-flex align-items-center">
                            <i class="fas fa-lock me-2"></i>
                            Пароль
                        </label>
                        <div class="d-flex align-items-center">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <button class="btn btn-outline-secondary ms-2" type="button" onclick="togglePassword('password')" style="flex-shrink: 0;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Войти
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
/* Обновленные стили для страницы входа в светлой теме */
[data-bs-theme="light"] body {
    background-color: #e9ecef !important;
}

[data-bs-theme="light"] .card {
    background-color: #ffffff !important;
    border-color: #ced4da !important;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important;
}

[data-bs-theme="light"] .card-body {
    color: #1a1d21 !important;
}

[data-bs-theme="light"] .card-body h4 {
    color: #0d1117 !important;
    font-weight: 600;
}

[data-bs-theme="light"] .card-body p,
[data-bs-theme="light"] .card-body small,
[data-bs-theme="light"] .card-body label {
    color: #1a1d21 !important;
}

[data-bs-theme="light"] .card-body .text-muted {
    color: #495057 !important;
}

[data-bs-theme="light"] .card-body a {
    color: #0d6efd !important;
}

[data-bs-theme="light"] .card-body a:hover {
    color: #0a58ca !important;
}

.esuid-form .form-label {
    margin-bottom: 0.5rem;
}

.esuid-form .form-label i {
    font-size: 1rem;
}

.esuid-form .form-control {
    border-width: 2px;
    border-style: solid;
    padding: 0.75rem;
}

[data-bs-theme="light"] .esuid-form .form-control {
    background-color: #ffffff !important;
    color: #1a1d21 !important;
    border-color: #adb5bd !important;
    width: 100%;
    max-width: 100%;
}

[data-bs-theme="light"] .esuid-form .form-control:focus {
    background-color: #ffffff !important;
    color: #1a1d21 !important;
    border-color: var(--bs-primary) !important;
    border-width: 2px;
    box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
}

[data-bs-theme="dark"] .esuid-form .form-control {
    border-width: 2px;
    border-color: #495057 !important;
}

[data-bs-theme="dark"] .esuid-form .form-control:focus {
    border-width: 2px;
    border-color: var(--bs-primary) !important;
}

.esuid-form .d-flex.align-items-center {
    gap: 0;
}

[data-bs-theme="light"] .form-label {
    color: #1a1d21 !important;
    font-weight: 500;
}

[data-bs-theme="light"] .btn-outline-secondary {
    color: #495057 !important;
    border-color: #ced4da !important;
}

[data-bs-theme="light"] .btn-outline-secondary:hover {
    background-color: #e9ecef !important;
    color: #1a1d21 !important;
    border-color: #adb5bd !important;
}

/* Мобильная адаптивность для формы входа */
@media (max-width: 767.98px) {
    .card {
        margin: 0;
        border-radius: 0.5rem;
    }

    .card-header {
        padding: 1rem;
    }

    .card-body {
        padding: 1rem;
    }

    h3 {
        font-size: 1.25rem;
    }

    h4 {
        font-size: 1.1rem;
    }

    .fa-3x {
        font-size: 2rem !important;
    }
}

/* Обеспечиваем читаемость текста кнопки "Войти" */
[data-bs-theme="light"] .btn-primary,
.btn-primary {
    color: #ffffff !important;
}

[data-bs-theme="light"] .btn-primary:hover,
.btn-primary:hover {
    color: #ffffff !important;
}

[data-bs-theme="light"] .btn-primary i,
.btn-primary i {
    color: #ffffff !important;
}

.card.border-primary {
    border-width: 2px;
}

.card.border-primary .card-header {
    border-bottom-width: 2px;
}

/* Контейнер карточки входа с фиксированной максимальной шириной */
.login-card-container {
    max-width: 450px;
    width: 100%;
    margin: 0 auto;
}

@media (max-width: 767.98px) {
    .login-card-container {
        max-width: 100%;
        margin: 0;
        padding: 0 1rem;
    }
    
    .login-card-container .card {
        width: 100%;
        border-radius: 0.5rem;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    
    .login-card-container .card-header {
        padding: 1rem !important;
        border-radius: 0.5rem 0.5rem 0 0 !important;
        width: calc(100% + 4px);
        margin-left: -2px;
        margin-right: -2px;
        margin-top: -2px;
        box-sizing: border-box;
        border-left: none;
        border-right: none;
        border-top: none;
    }
    
    .esuid-form .d-flex.align-items-center {
        flex-direction: row;
        align-items: center;
    }

    .esuid-form .d-flex.align-items-center .form-control {
        width: 100%;
        margin-bottom: 0;
        flex: 1;
        font-size: 16px !important;
        padding: 0.75rem !important;
        min-height: 44px;
    }

    .esuid-form .d-flex.align-items-center .btn {
        width: auto;
        flex-shrink: 0;
        margin-left: 0.5rem;
        font-size: 16px !important;
        padding: 0.75rem !important;
        min-width: 44px;
        min-height: 44px;
    }
    
    .esuid-form .form-label {
        font-size: 14px !important;
        margin-bottom: 0.5rem;
    }
    
    .esuid-form .form-label i {
        font-size: 1rem !important;
    }
    
    .btn-primary.btn-lg {
        font-size: 16px !important;
        padding: 0.75rem 1.25rem !important;
        min-height: 44px;
    }
    
    .card-body {
        padding: 1rem !important;
    }
    
    h3 {
        font-size: 1.25rem !important;
    }
    
    h4 {
        font-size: 1.1rem !important;
    }
    
    p, small {
        font-size: 13px !important;
    }
    
    .fa-3x {
        font-size: 2rem !important;
    }
}
</style>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const container = input.closest('.d-flex.align-items-center');
    const button = container ? container.querySelector('button') : null;
    const icon = button ? button.querySelector('i') : null;
    
    if (!icon) return;
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
