{% extends 'base.html' %}

{% block title %}400 | Некорректный запрос{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-circle fa-4x text-info mb-3"></i>
        <h1 class="display-1 fw-bold text-info">400</h1>
        <h2 class="mb-4">Некорректный запрос</h2>
        <p class="lead text-muted mb-4">
            Сервер не смог обработать ваш запрос из-за некорректных данных.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-info">
                <i class="fas fa-arrow-left me-2"></i>Вернуться назад
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-info">
                <i class="fas fa-home me-2"></i>На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
