{% extends 'base.html' %}

{% block title %}403 | Доступ запрещен{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-lock fa-4x text-warning mb-3"></i>
        <h1 class="display-1 fw-bold text-warning">403</h1>
        <h2 class="mb-4">Доступ запрещен</h2>
        <p class="lead text-muted mb-4">
            У вас нет прав для доступа к этой странице.
            {% if not user.is_authenticated %}
                Возможно, вам нужно <a href="{% url 'login' %}">войти в систему</a>.
            {% endif %}
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-warning">
                <i class="fas fa-arrow-left me-2"></i>Вернуться назад
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-warning">
                <i class="fas fa-home me-2"></i>На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
