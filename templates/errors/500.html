{% extends 'base.html' %}

{% block title %}500 | Внутренняя ошибка сервера{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h2 class="mb-4">Внутренняя ошибка сервера</h2>
        <p class="lead text-muted mb-4">
            Произошла непредвиденная ошибка. Наши специалисты уже работают над её устранением.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-danger">
                <i class="fas fa-arrow-left me-2"></i>Вернуться назад
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-danger">
                <i class="fas fa-home me-2"></i>На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
