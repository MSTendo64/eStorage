{% extends 'base.html' %}

{% block title %}{{ file.filename }} | Eventshock Storage{% endblock %}

{% block content %}
<style>
/* Запрещаем прокрутку страницы при публичном просмотре */
body {
    overflow: hidden !important;
    position: fixed;
    width: 100%;
    height: 100%;
}
html {
    overflow: hidden !important;
}
</style>
<div class="container-fluid p-0" style="position: fixed; width: 100%; height: 100vh; overflow: hidden; top: 0; left: 0;">
    {% if file.is_video %}
    <!-- Видео плеер с улучшенным интерфейсом -->
    <div id="publicVideoPlayer" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; min-width: 800px; min-height: 500px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column;">
        <div class="draggable-header-public" style="cursor: default; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); padding: 0.25rem 1rem; min-height: 24px; display: flex; align-items: center; justify-content: space-between; user-select: none;">
            <h5 class="modal-title-public" style="font-size: 0.75rem; margin: 0; font-weight: 600; flex: 1; text-align: left;" id="publicVideoTitle">{{ file.filename }}</h5>
            <a href="{{ file.file.url }}" class="btn btn-sm btn-success me-2" download style="font-size: 0.65rem; padding: 0.15rem 0.5rem;">
                <i class="fas fa-download"></i>
            </a>
            <button type="button" class="btn-close btn-close-sm" onclick="window.location.href='/';" style="font-size: 0.75rem; margin-left: 0.5rem;"></button>
        </div>
        <div style="position: relative; background: #000; width: 100%; flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <video id="publicVideo" class="plyr-video" playsinline controls style="width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain;">
                <source src="{{ file.file.url }}" type="video/mp4">
            </video>
            <div class="resize-handle-public resize-handle-se-public" style="position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; cursor: se-resize; z-index: 1000;"></div>
        </div>
    </div>
    {% elif file.is_image %}
    <div id="publicImagePlayer" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 90vw; max-height: 90vh; z-index: 1000; pointer-events: auto;">
        <div class="draggable-header-public" style="cursor: default; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); padding: 0.25rem 1rem; min-height: 24px; display: flex; align-items: center; justify-content: space-between; user-select: none; border-radius: 8px 8px 0 0;">
            <h5 class="modal-title-public" style="font-size: 0.75rem; margin: 0; font-weight: 600; flex: 1; text-align: left;" id="publicImageTitle">{{ file.filename }}</h5>
            <a href="{{ file.file.url }}" class="btn btn-sm btn-success me-2" download style="font-size: 0.65rem; padding: 0.15rem 0.5rem;">
                <i class="fas fa-download"></i>
            </a>
            <button type="button" class="btn-close btn-close-sm" onclick="window.location.href='/';" style="font-size: 0.75rem; margin-left: 0.5rem;"></button>
        </div>
        <img src="{{ file.file.url }}" class="img-fluid" alt="{{ file.filename }}" style="max-height: 90vh; display: block; border-radius: 0 0 8px 8px;">
    </div>
    {% elif file.is_audio %}
    <div id="publicAudioPlayer" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; min-width: 500px; background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3); pointer-events: auto;">
        <div class="draggable-header-public" style="cursor: default; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); padding: 0.25rem 1rem; min-height: 24px; display: flex; align-items: center; justify-content: space-between; user-select: none; margin: -1rem -1rem 1rem -1rem; border-radius: 8px 8px 0 0;">
            <h5 class="modal-title-public" style="font-size: 0.75rem; margin: 0; font-weight: 600; flex: 1; text-align: left;" id="publicAudioTitle">{{ file.filename }}</h5>
            <a href="{{ file.file.url }}" class="btn btn-sm btn-success me-2" download style="font-size: 0.65rem; padding: 0.15rem 0.5rem;">
                <i class="fas fa-download"></i>
            </a>
            <button type="button" class="btn-close btn-close-sm" onclick="window.location.href='/';" style="font-size: 0.75rem; margin-left: 0.5rem;"></button>
        </div>
        <audio class="plyr-audio" controls style="width: 100%;">
            <source src="{{ file.file.url }}" type="audio/mpeg">
        </audio>
    </div>
    {% endif %}
</div>

<style>
.resize-handle-public {
    background: transparent;
    border: none;
}

.resize-handle-se-public::after {
    content: '';
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 10px 10px;
    border-color: transparent transparent rgba(255, 255, 255, 0.5) transparent;
}
</style>

<script>
let isResizingPublic = false;
let resizeStartPublic = { x: 0, y: 0, width: 0, height: 0, left: 0, top: 0 };
let activeResizeHandlePublic = null;

function updatePublicTitleColor() {
    const header = document.querySelector('.draggable-header-public');
    const title = document.querySelector('.modal-title-public');
    const player = document.getElementById('publicVideoPlayer') || 
                   document.getElementById('publicImagePlayer') || 
                   document.getElementById('publicAudioPlayer');
    
    if (!header || !title || !player) return;
    
    const style = window.getComputedStyle(header);
    const bgColor = style.backgroundColor;
    const rgbaMatch = bgColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
    
    if (rgbaMatch) {
        const r = parseInt(rgbaMatch[1]);
        const g = parseInt(rgbaMatch[2]);
        const b = parseInt(rgbaMatch[3]);
        const alpha = parseFloat(rgbaMatch[4] || '1');
        
        const playerStyle = window.getComputedStyle(player);
        const playerBg = playerStyle.backgroundColor;
        const playerMatch = playerBg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
        
        let finalR = r, finalG = g, finalB = b;
        if (playerMatch) {
            const playerR = parseInt(playerMatch[1]);
            const playerG = parseInt(playerMatch[2]);
            const playerB = parseInt(playerMatch[3]);
            finalR = Math.round(r * alpha + playerR * (1 - alpha));
            finalG = Math.round(g * alpha + playerG * (1 - alpha));
            finalB = Math.round(b * alpha + playerB * (1 - alpha));
        }
        
        const brightness = (finalR * 0.299 + finalG * 0.587 + finalB * 0.114);
        if (brightness < 128) {
            title.style.color = '#ffffff';
            title.style.textShadow = '1px 1px 3px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8)';
        } else {
            title.style.color = '#000000';
            title.style.textShadow = '1px 1px 3px rgba(255, 255, 255, 0.9), -1px -1px 3px rgba(255, 255, 255, 0.9), 0 0 4px rgba(255, 255, 255, 0.8)';
        }
    }
}

function initPublicDragAndResize() {
    const player = document.getElementById('publicVideoPlayer') || 
                   document.getElementById('publicImagePlayer') || 
                   document.getElementById('publicAudioPlayer');
    const header = document.querySelector('.draggable-header-public');
    const resizeHandle = document.querySelector('.resize-handle-se-public');
    
    if (!player || !header) return;
    
    updatePublicTitleColor();
    
    // Убираем возможность перетаскивания - делаем окно статичным
    header.style.cursor = 'default';
    
    // Закрепляем позицию окна - фиксируем в центре экрана
    if (player) {
        // Сохраняем исходную позицию
        const originalTransform = player.style.transform || 'translate(-50%, -50%)';
        
        // Фиксируем позицию, чтобы она не менялась
        player.style.position = 'fixed';
        player.style.left = '50%';
        player.style.top = '50%';
        player.style.transform = originalTransform;
    }
    
    // Resize
    if (resizeHandle) {
        resizeHandle.addEventListener('mousedown', (e) => {
            isResizingPublic = true;
            activeResizeHandlePublic = resizeHandle;
            const rect = player.getBoundingClientRect();
            resizeStartPublic.x = e.clientX;
            resizeStartPublic.y = e.clientY;
            resizeStartPublic.width = rect.width;
            resizeStartPublic.height = rect.height;
            resizeStartPublic.left = rect.left;
            resizeStartPublic.top = rect.top;
            
            document.addEventListener('mousemove', handleResizePublic);
            document.addEventListener('mouseup', stopResizePublic);
            e.preventDefault();
            e.stopPropagation();
        });
    }
    
    function handleResizePublic(e) {
        if (!isResizingPublic || !activeResizeHandlePublic) return;
        
        const deltaX = e.clientX - resizeStartPublic.x;
        const deltaY = e.clientY - resizeStartPublic.y;
        
        let newWidth = resizeStartPublic.width + deltaX;
        let newHeight = resizeStartPublic.height + deltaY;
        
        // Минимальные размеры с учетом шапки и элементов управления плеера
        const headerHeight = 24; // Высота шапки
        const controlsHeight = 80; // Минимальная высота для элементов управления
        const minWidth = 400; // Увеличено для корректного отображения элементов управления
        const minHeight = headerHeight + controlsHeight + 200; // Минимум 304px (24 + 80 + 200)
        
        // Максимальная ширина - 95% экрана, но центр окна остается на месте
        const maxWidth = window.innerWidth * 0.95;
        const maxHeight = window.innerHeight * 0.95;
        
        newWidth = Math.max(minWidth, Math.min(newWidth, maxWidth));
        newHeight = Math.max(minHeight, Math.min(newHeight, maxHeight));
        
        // Изменяем только размер, позиция остается зафиксированной в центре
        player.style.width = newWidth + 'px';
        player.style.height = newHeight + 'px';
        
        // Убеждаемся, что позиция остается зафиксированной
        player.style.left = '50%';
        player.style.top = '50%';
        player.style.transform = 'translate(-50%, -50%)';
        
        // Обновляем размер контейнера видео, чтобы элементы управления были видны
        const videoContainer = player.querySelector('div[style*="position: relative"]');
        if (videoContainer) {
            const videoHeight = newHeight - headerHeight;
            videoContainer.style.height = videoHeight + 'px';
            videoContainer.style.minHeight = videoHeight + 'px';
            
            // Обновляем размер видео элемента
            const video = videoContainer.querySelector('video');
            if (video) {
                video.style.height = '100%';
                video.style.maxHeight = '100%';
            }
        }
    }
    
    function stopResizePublic() {
        isResizingPublic = false;
        activeResizeHandlePublic = null;
        document.removeEventListener('mousemove', handleResizePublic);
        document.removeEventListener('mouseup', stopResizePublic);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    if (document.querySelector('.plyr-video')) {
        const player = new Plyr('.plyr-video', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'duration',
                'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
            ]
        });
    }
    if (document.querySelector('.plyr-audio')) {
        new Plyr('.plyr-audio');
    }
    
    // Инициализируем drag and resize для публичного просмотра
    setTimeout(() => {
        initPublicDragAndResize();
    }, 100);
});
</script>
{% endblock %}
