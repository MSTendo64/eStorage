{% extends 'base.html' %}

{% block title %}{{ file.filename }} | Eventshock Storage{% endblock %}

{% block content %}
<style>
/* Запрещаем прокрутку страницы при публичном просмотре */
body {
    overflow: hidden !important;
    position: fixed;
    width: 100%;
    height: 100%;
}
html {
    overflow: hidden !important;
}
</style>
<div class="container-fluid p-0" style="position: fixed; width: 100%; height: 100vh; overflow: hidden; top: 0; left: 0;">
    {% if file.is_video %}
    <!-- Видео плеер с единой структурой -->
    <div id="publicVideoPlayer" class="unified-player" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; min-width: 800px; min-height: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);"></div>
    {% elif file.is_image %}
    <div id="publicImagePlayer" class="unified-player" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 90vw; max-height: 90vh; z-index: 1000; pointer-events: auto;"></div>
    {% elif file.is_audio %}
    <div id="publicAudioPlayer" class="unified-player" style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1000; min-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); pointer-events: auto;"></div>
    {% endif %}
</div>

<style>
.resize-handle-public {
    background: transparent;
    border: none;
}

.resize-handle-se-public::after {
    content: '';
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 10px 10px;
    border-color: transparent transparent rgba(255, 255, 255, 0.5) transparent;
}
</style>

<script>
let isResizingPublic = false;
let resizeStartPublic = { x: 0, y: 0, width: 0, height: 0, left: 0, top: 0 };
let activeResizeHandlePublic = null;

function updatePublicTitleColor() {
    const headers = document.querySelectorAll('.unified-player-header');
    const titles = document.querySelectorAll('.unified-player-title');
    
    headers.forEach((header, index) => {
        if (titles[index]) {
            updatePlayerHeaderColor(header, titles[index]);
        }
    });
}

function initPublicDragAndResize() {
    const player = document.getElementById('publicVideoPlayer');
    if (!player) return;
    
    const header = player.querySelector('.unified-player-header');
    const resizeHandle = player.querySelector('.resize-handle');
    
    if (!header) return;
    
    updatePublicTitleColor();
    
    // Убираем возможность перетаскивания - делаем окно статичным
    header.style.cursor = 'default';
    
    // Закрепляем позицию окна - фиксируем в центре экрана
    player.style.position = 'fixed';
    player.style.left = '50%';
    player.style.top = '50%';
    player.style.transform = 'translate(-50%, -50%)';
    
    // Resize только для видео
    if (resizeHandle) {
        resizeHandle.addEventListener('mousedown', (e) => {
            isResizingPublic = true;
            activeResizeHandlePublic = resizeHandle;
            const rect = player.getBoundingClientRect();
            resizeStartPublic.x = e.clientX;
            resizeStartPublic.y = e.clientY;
            resizeStartPublic.width = rect.width;
            resizeStartPublic.height = rect.height;
            resizeStartPublic.left = rect.left;
            resizeStartPublic.top = rect.top;
            
            document.addEventListener('mousemove', handleResizePublic);
            document.addEventListener('mouseup', stopResizePublic);
            e.preventDefault();
            e.stopPropagation();
        });
    }
    
    function handleResizePublic(e) {
        if (!isResizingPublic || !activeResizeHandlePublic) return;
        
        const deltaX = e.clientX - resizeStartPublic.x;
        const deltaY = e.clientY - resizeStartPublic.y;
        
        let newWidth = resizeStartPublic.width + deltaX;
        let newHeight = resizeStartPublic.height + deltaY;
        
        // Минимальные размеры с учетом шапки и элементов управления плеера
        const headerHeight = 24; // Высота шапки
        const controlsHeight = 80; // Минимальная высота для элементов управления
        const minWidth = 400; // Увеличено для корректного отображения элементов управления
        const minHeight = headerHeight + controlsHeight + 200; // Минимум 304px (24 + 80 + 200)
        
        // Максимальная ширина - 95% экрана, но центр окна остается на месте
        const maxWidth = window.innerWidth * 0.95;
        const maxHeight = window.innerHeight * 0.95;
        
        newWidth = Math.max(minWidth, Math.min(newWidth, maxWidth));
        newHeight = Math.max(minHeight, Math.min(newHeight, maxHeight));
        
        // Изменяем только размер, позиция остается зафиксированной в центре
        player.style.width = newWidth + 'px';
        player.style.height = newHeight + 'px';
        
        // Убеждаемся, что позиция остается зафиксированной
        player.style.left = '50%';
        player.style.top = '50%';
        player.style.transform = 'translate(-50%, -50%)';
        
        // Получаем реальную высоту шапки
        const header = player.querySelector('.unified-player-header');
        const actualHeaderHeight = header ? header.offsetHeight : headerHeight;
        
        // Обновляем размер контейнера видео, чтобы элементы управления были видны
        const videoContainer = player.querySelector('.unified-player-content');
        if (videoContainer) {
            const videoHeight = newHeight - actualHeaderHeight;
            videoContainer.style.height = videoHeight + 'px';
            videoContainer.style.minHeight = videoHeight + 'px';
            videoContainer.style.maxHeight = videoHeight + 'px';
        }
    }
    
    function stopResizePublic() {
        isResizingPublic = false;
        activeResizeHandlePublic = null;
        document.removeEventListener('mousemove', handleResizePublic);
        document.removeEventListener('mouseup', stopResizePublic);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    let playerElement = null;
    let playerType = null;
    let filename = '';
    let fileUrl = '';
    
    // Определяем тип файла и создаем единую структуру плеера
    {% if file.is_video %}
    playerElement = document.getElementById('publicVideoPlayer');
    playerType = 'video';
    filename = '{{ file.filename|escapejs }}';
    fileUrl = '{{ file.file.url }}';
    {% elif file.is_image %}
    playerElement = document.getElementById('publicImagePlayer');
    playerType = 'image';
    filename = '{{ file.filename|escapejs }}';
    fileUrl = '{{ file.file.url }}';
    {% elif file.is_audio %}
    playerElement = document.getElementById('publicAudioPlayer');
    playerType = 'audio';
    filename = '{{ file.filename|escapejs }}';
    fileUrl = '{{ file.file.url }}';
    {% endif %}
    
    if (playerElement) {
        // Создаем единую структуру плеера
        const playerData = createUnifiedPlayerHTML(playerType, fileUrl, filename, fileUrl, 'window.location.href=\'/\'');
        playerElement.innerHTML = playerData.html;
        
        // Инициализируем Plyr для видео/аудио
        if (playerData.playerClass) {
            const mediaElement = playerElement.querySelector('.' + playerData.playerClass);
            if (mediaElement) {
                initUnifiedPlayer(mediaElement);
            }
        }
        
        // Обновляем цвет заголовка
        const header = playerElement.querySelector('.unified-player-header');
        const title = playerElement.querySelector('.unified-player-title');
        if (header && title) {
            updatePlayerHeaderColor(header, title);
        }
    }
    
    // Инициализируем drag and resize для публичного просмотра (только для видео)
    if (playerType === 'video') {
        setTimeout(() => {
            initPublicDragAndResize();
        }, 100);
    }
    
    // Обновляем цвет при изменении темы
    const observer = new MutationObserver(() => {
        if (playerElement) {
            const header = playerElement.querySelector('.unified-player-header');
            const title = playerElement.querySelector('.unified-player-title');
            if (header && title) {
                updatePlayerHeaderColor(header, title);
            }
        }
    });
    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-bs-theme']
    });
    
    // Обновляем при изменении системной темы (если используется auto)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (playerElement) {
            const header = playerElement.querySelector('.unified-player-header');
            const title = playerElement.querySelector('.unified-player-title');
            if (header && title) {
                updatePlayerHeaderColor(header, title);
            }
        }
    });
});
</script>
{% endblock %}
