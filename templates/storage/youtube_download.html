{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Скачать видео с YouTube</h5>
        </div>
        <div class="card-body">
            <form id="downloadForm" onsubmit="downloadVideo(event)">
                <div class="mb-3">
                    <label class="form-label">URL видео</label>
                    <input type="url" class="form-control" id="videoUrl" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Формат</label>
                    <select class="form-select" id="formatType">
                        <option value="video">Видео</option>
                        <option value="audio">Только аудио</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Качество</label>
                    <select class="form-select" id="quality">
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                        <option value="360p">360p</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="downloadBtn">
                    <i class="fas fa-download me-2"></i>Скачать
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function downloadVideo(event) {
    event.preventDefault();
    
    const btn = document.getElementById('downloadBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Загрузка...';
    
    const data = {
        url: document.getElementById('videoUrl').value,
        format: document.getElementById('formatType').value,
        quality: document.getElementById('quality').value
    };
    
    fetch('/storage/youtube-download/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = data.redirect_url;
        } else {
            alert('Ошибка: ' + data.error);
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Произошла ошибка при загрузке');
        btn.disabled = false;
        btn.innerHTML = originalText;
    });
}
</script>
{% endblock %}
