{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Загруженные видео</h2>
    
    <div class="row">
        {% for video in videos %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ video.title }}</h5>
                    <p class="card-text">
                        <small class="text-muted">Загружено: {{ video.downloaded_at|date:"d.m.Y H:i" }}</small>
                    </p>
                    <a href="{{ video.file_path.url }}" class="btn btn-primary" download>Скачать</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
